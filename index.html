<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="장애슬 | 서경대학교 스포츠앤테크놀로지전공 | 스포츠산업 포트폴리오">
  <title>장애슬 — 스포츠산업 포트폴리오</title>
  <style>
    :root {
      --bg: #080b12;
      --panel: #101622;
      --ink: #f5f7fb;
      --muted: #a5afc1;
      --blue: #1688ff;
      --blue2: #4eb6ff;
      --line: rgba(180, 202, 236, .2);
      --site-max: 1140px; /* 고해상도 모니터에서도 화면 깨짐 방지 */
      --nav-height: 76px;
    }
    
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: var(--nav-height); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      line-height: 1.65;
      letter-spacing: -.02em;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background: 
        radial-gradient(ellipse at 88% 4%, rgba(0, 105, 255, .15), transparent 32%),
        radial-gradient(ellipse at 5% 55%, rgba(0, 105, 255, .08), transparent 34%);
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    ::selection { background: var(--blue); color: white; }

    /* 상단 메뉴 중앙 정렬 및 여백 고정 */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-height);
      z-index: 1000;
      background: rgba(8, 11, 18, .92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }
    
    .nav-inner {
      width: min(var(--site-max), 90%);
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      font-size: 16px;
      font-weight: 850;
      letter-spacing: -.02em;
    }
    .wordmark small {
      display: block;
      color: var(--blue2);
      font-size: 10px;
      letter-spacing: .18em;
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      transition: color .25s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--ink);
    }

    .menu-btn {
      display: none;
      background: transparent;
      color: white;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 12px;
    }

    /* 레이아웃 폭 너비 중앙 집중화 (수평 벌어짐 해결) */
    main { padding-top: var(--nav-height); width: 100%; }
    .wrap {
      width: min(var(--site-max), 90%);
      margin: 0 auto !important;
    }
    
    section {
      padding: 80px 0;
      border-bottom: 1px solid var(--line);
    }

    .kicker {
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--blue2);
      font-weight: 800;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(38px, 4.5vw, 64px);
      line-height: 1.1;
      letter-spacing: -.04em;
      margin: 12px 0 20px;
      font-weight: 850;
    }

    .name-en {
      display: block;
      font-size: 0.4em;
      letter-spacing: 0.08em;
      color: var(--blue2);
      font-weight: 700;
      margin-bottom: 4px;
    }

    h2 {
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1.2;
      letter-spacing: -.03em;
      margin: 0 0 16px;
    }

    h3 {
      font-size: 18px;
      letter-spacing: -.02em;
      margin: 0 0 10px;
      color: var(--ink);
      font-weight: 700;
    }

    p { color: #c5cedc; margin: 0 0 14px; font-size: 15px; line-height: 1.65; }
    .muted { color: var(--muted); }
    .blue { color: var(--blue2); }

    /* 히어로 그리드 비율 수정 (텍스트 1.3 : 이미지 0.7 비율 유지) */
    .hero {
      padding: 60px 0;
      min-height: calc(85vh - var(--nav-height));
      display: flex;
      align-items: center;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      align-items: center;
      gap: 40px;
      width: 100%;
    }
    .hero .tagline {
      font-size: clamp(16px, 1.6vw, 20px);
      color: #dbe4f2;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .hero-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #c5d2e4;
      background: rgba(16, 22, 34, .7);
    }
    .hero-actions { display: flex; gap: 12px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 6px;
      border: 1px solid var(--line);
      font-size: 14px;
      font-weight: 750;
      transition: all .3s ease;
    }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: white; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(22,136,255,.25); }

    .portrait-wrap {
      position: relative;
      width: 100%;
      max-width: 320px;
      aspect-ratio: 4/5;
      justify-self: end;
    }
    .portrait {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #151d2a;
      display: block;
    }
    .portrait-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 20px 16px 12px;
      background: linear-gradient(transparent, rgba(3,7,14,.95));
      font-size: 11px;
      letter-spacing: .15em;
      color: white;
      font-weight: 700;
    }

    /* 카드 레이아웃 구조화 */
    .section-head {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 40px;
      align-items: start;
      margin-bottom: 40px;
    }

    .card {
      background: linear-gradient(145deg, rgba(20,29,44,.95), rgba(12,17,27,.85));
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 28px;
      transition: transform .3s ease, border-color .3s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(22, 136, 255, .5);
    }

    .intro-grid, .skills-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card-no {
      color: var(--blue2);
      font-size: 12px;
      letter-spacing: .15em;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .interest-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .tag {
      font-size: 12px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: #e0e8f5;
      background: rgba(255,255,255,.03);
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .experience-card {
      position: relative;
      overflow: hidden;
    }
    .experience-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 40px; height: 3px;
      background: var(--blue);
    }
    .duration {
      font-size: 22px;
      font-weight: 800;
      color: white;
      margin: 10px 0 4px;
    }

    .subsection { margin-top: 56px; }
    .subsection-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .activity-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .activity {
      padding: 24px;
      border-top: 3px solid var(--blue);
      background: rgba(17, 25, 39, .7);
      border-radius: 0 0 8px 8px;
    }

    .featured-banners {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .project-banner {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(135deg, #121c2d, #0b1019);
      min-height: 240px;
    }
    .btn-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--blue2);
      margin-top: 18px;
    }

    .credentials-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .education-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
