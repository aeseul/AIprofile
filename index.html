<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="장애슬 | 서경대학교 스포츠앤테크놀로지전공 | 스포츠산업 포트폴리오">
  <title>장애슬 — 스포츠산업 포트폴리오</title>
  <style>
    :root {
      --bg: #080b12;
      --panel: #101622;
      --ink: #f5f7fb;
      --muted: #a5afc1;
      --blue: #1688ff;
      --blue2: #4eb6ff;
      --cyan: #38bdf8;
      --line: rgba(180, 202, 236, .2);
      --site-max: 1100px;
      --nav-height: 76px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: var(--nav-height); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      line-height: 1.65;
      letter-spacing: -.02em;
      overflow-x: hidden;
      word-break: keep-all; /* 단어 단위 자연스러운 줄바꿈 */
    }

    /* 은은한 네온 오로라 배경 애니메이션 */
    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      z-index: -1;
      background: 
        radial-gradient(circle at 85% 10%, rgba(22, 136, 255, 0.18), transparent 35%),
        radial-gradient(circle at 10% 50%, rgba(56, 189, 248, 0.12), transparent 40%),
        radial-gradient(circle at 70% 85%, rgba(0, 75, 200, 0.15), transparent 45%);
      animation: auraPulse 12s ease-in-out infinite alternate;
    }

    @keyframes auraPulse {
      0% { transform: scale(1) translate(0, 0); opacity: 0.8; }
      50% { transform: scale(1.05) translate(-10px, 15px); opacity: 1; }
      100% { transform: scale(0.98) translate(15px, -10px); opacity: 0.85; }
    }

    /* 마우스 은은한 반응형 빛 글로우 */
    .mouse-glow {
      position: fixed;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(78, 182, 255, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.3s ease, height 0.3s ease;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    ::selection { background: var(--blue); color: white; }

    /* Header & Nav */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-height);
      z-index: 1000;
      background: rgba(8, 11, 18, .85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    header.scrolled {
      background: rgba(8, 11, 18, .96);
      border-color: rgba(78, 182, 255, 0.3);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }
    
    .nav-inner {
      width: min(var(--site-max), calc(100% - 48px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      font-size: 16px;
      font-weight: 850;
      letter-spacing: -.02em;
    }
    .wordmark small {
      display: block;
      color: var(--blue2);
      font-size: 10px;
      letter-spacing: .18em;
      font-weight: 700;
      transition: color 0.3s;
    }
    .wordmark:hover small {
      color: var(--cyan);
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      position: relative;
      padding: 4px 0;
      transition: color .25s ease;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; width: 0; height: 2px;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      border-radius: 2px;
      transition: width 0.3s var(--ease-out);
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--ink);
    }
    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 100%;
    }

    .menu-btn {
      display: none;
      background: transparent;
      color: white;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 12px;
    }

    main { padding-top: var(--nav-height); width: 100%; }
    .wrap {
      width: min(var(--site-max), calc(100% - 48px));
      margin: 0 auto !important;
    }
    
    section {
      padding: 90px 0;
      border-bottom: 1px solid var(--line);
      position: relative;
    }

    .kicker {
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--blue2);
      font-weight: 800;
      margin-bottom: 16px;
      display: inline-block;
    }

    h1 {
      font-size: clamp(38px, 4.2vw, 56px);
      line-height: 1.15;
      letter-spacing: -.03em;
      margin: 0 0 20px;
      font-weight: 850;
      word-break: keep-all;
    }

    .name-en {
      display: block;
      font-size: 14px;
      letter-spacing: 0.12em;
      color: var(--blue2);
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(78, 182, 255, 0.4);
    }

    h2 {
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1.2;
      letter-spacing: -.03em;
      margin: 0 0 12px;
      word-break: keep-all;
    }

    h3 {
      font-size: 18px;
      letter-spacing: -.02em;
      margin: 0 0 10px;
      color: var(--ink);
      font-weight: 700;
      word-break: keep-all;
    }

    p { 
      color: #c5cedc; 
      margin: 0 0 14px; 
      font-size: 15px; 
      line-height: 1.65;
      word-break: keep-all;
    }
    .muted { color: var(--muted); }
    .blue { color: var(--blue2); }

    /* 히어로 섹션 */
    .hero {
      padding: 70px 0;
      min-height: calc(88vh - var(--nav-height));
      display: flex;
      align-items: center;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 270px;
      align-items: center;
      gap: 48px;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }
    .hero .tagline {
      font-size: clamp(15px, 1.6vw, 18px);
      color: #dbe4f2;
      line-height: 1.6;
      margin-bottom: 28px;
      font-weight: 500;
      word-break: keep-all;
    }
    .hero-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #c5d2e4;
      background: rgba(16, 22, 34, .7);
      backdrop-filter: blur(10px);
      white-space: nowrap;
